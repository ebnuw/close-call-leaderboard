name: archive

# Copies the referee's close-1 rooms into data/ while technocore.chat still
# retains them, then commits the result. Only signed referee posts are kept.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test tests/*.test.js

      - name: Archive
        run: node tools/archive.mjs

      - name: Commit
        run: |
          if git diff --quiet -- data/raw; then
            echo "no new referee posts"
            git checkout -- data
            exit 0
          fi
          git config user.name "close-call-archiver"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "archive: sweep $(node -p 'require("./data/latest.json").sweep')"
          git push
